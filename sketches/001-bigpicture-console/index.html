<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahoy — Big Picture (living-room console mode)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0714; --violet:#8b5cf6; --cyan:#22d3ee; --pink:#f472b6; --text:#f1eefb; --dim:#9a92b8;
}
html,body{height:100%}
body{font-family:Sora,sans-serif;background:
  radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,.18), transparent),
  radial-gradient(1000px 700px at 90% 110%, rgba(34,211,238,.12), transparent),
  var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.disp{font-family:Archivo,sans-serif}

/* top nav */
.tabs{display:flex;align-items:center;gap:8px;padding:20px 44px 6px;flex:none}
.tab{border:none;background:rgba(255,255,255,.05);color:var(--dim);font:inherit;font-size:14px;font-weight:700;
  letter-spacing:.06em;padding:10px 26px;border-radius:999px;cursor:pointer;transition:.18s;text-transform:uppercase}
.tab:hover{color:var(--text);background:rgba(255,255,255,.1)}
.tab.on{background:linear-gradient(135deg,var(--violet),var(--cyan));color:#fff;box-shadow:0 6px 30px rgba(139,92,246,.45)}
.tabs .clock{margin-left:auto;text-align:right;font-family:Archivo,sans-serif;font-weight:800;font-size:22px}
.tabs .clock small{display:block;font-family:Sora;font-weight:400;font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.view{flex:1;overflow-y:auto;padding:14px 44px 40px;scroll-behavior:smooth}
.view::-webkit-scrollbar{width:0}

.greet{font-size:15px;color:var(--dim);margin:10px 0 2px}
.greet b{color:var(--text)}

/* rows */
h2.rowt{font-family:Archivo,sans-serif;font-weight:900;font-size:23px;letter-spacing:-.01em;margin:26px 0 12px}
h2.rowt span{color:var(--violet)}
.tiles{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .2s, box-shadow .2s;
  border:2px solid rgba(255,255,255,.06);outline:none}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) scale(1.03);border-color:var(--cyan);
  box-shadow:0 0 0 4px rgba(34,211,238,.18), 0 24px 50px rgba(0,0,0,.6)}
.wide{width:320px;height:180px}
.big{width:212px;height:290px}
.big .t-fill{font-size:24px;letter-spacing:.02em}
.mini{width:158px;height:158px;border-radius:14px}
.t-fill{position:absolute;inset:0;display:grid;place-items:center;font-family:Archivo,sans-serif;font-weight:900;
  font-size:52px;color:rgba(255,255,255,.9);text-shadow:0 3px 20px rgba(0,0,0,.4)}
.t-fill.small{font-size:36px}
.t-label{position:absolute;left:14px;bottom:12px;right:14px;z-index:2}
.t-label b{display:block;font-size:15px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.t-label small{font-size:11px;color:rgba(255,255,255,.75)}
.ribbon{position:absolute;top:10px;right:10px;z-index:2;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  background:rgba(0,0,0,.55);backdrop-filter:blur(5px);padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
.rb-play{color:#86efac}.rb-free{color:var(--cyan)}._rb{color:#fde68a}
.t-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.75))}
/* gradients */
.g1{background:linear-gradient(135deg,#4c1d95,#7c3aed 55%,#22d3ee)}
.g2{background:linear-gradient(135deg,#831843,#e11d48 60%,#fb923c)}
.g3{background:linear-gradient(135deg,#064e3b,#059669 60%,#a3e635)}
.g4{background:linear-gradient(135deg,#1e3a8a,#3b82f6 60%,#67e8f9)}
.g5{background:linear-gradient(135deg,#713f12,#f59e0b 60%,#fef08a)}
.g6{background:linear-gradient(135deg,#4a044e,#c026d3 60%,#f0abfc)}
.g7{background:linear-gradient(135deg,#450a0a,#dc2626 60%,#fbbf24)}
.g8{background:linear-gradient(135deg,#0f172a,#475569 60%,#cbd5e1)}
.g9{background:linear-gradient(135deg,#042f2e,#0d9488 60%,#5eead4)}

/* console cards */
.console-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.con{border-radius:18px;padding:22px;cursor:pointer;position:relative;overflow:hidden;min-height:130px;
  display:flex;flex-direction:column;justify-content:flex-end;border:2px solid rgba(255,255,255,.07);transition:.2s;outline:none}
.con:hover,.con:focus-visible{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 20px 46px rgba(0,0,0,.55)}
.con b{font-family:Archivo;font-size:19px;font-weight:900}
.con small{color:rgba(255,255,255,.75);font-size:11.5px}
.con .n{position:absolute;right:16px;top:14px;font-family:Archivo;font-weight:900;font-size:34px;opacity:.28}

/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.friend{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:14px 16px}
.fac{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:Archivo;font-size:17px}
.friend b{display:block;font-size:14px}
.friend small{font-size:11.5px;color:var(--dim)}
.dot-g{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;margin-right:5px}

/* sheet modal */
#veil{position:fixed;inset:0;background:rgba(5,3,10,.7);backdrop-filter:blur(8px);display:none;z-index:40}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,94vw);
  background:linear-gradient(180deg,#181029,#100b1d);border:1px solid rgba(255,255,255,.12);border-bottom:none;
  border-radius:26px 26px 0 0;padding:34px 40px 44px;z-index:41;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#sheet.open,#veil.show{display:block}
#sheet.open{transform:translate(-50%,0)}
.sh-head{display:flex;gap:22px;align-items:flex-end;margin-bottom:20px}
.sh-art{width:150px;height:200px;border-radius:14px;display:grid;place-items:center;font-family:Archivo;font-weight:900;font-size:44px;flex:none}
.sh-info h3{font-family:Archivo;font-weight:900;font-size:30px}
.sh-info p{color:var(--dim);font-size:13px;margin-top:8px;line-height:1.6}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  padding:5px 12px;border-radius:999px;color:#ddd}
.chip.hot{border-color:var(--cyan);color:var(--cyan)}
.playfab{width:100%;border:none;border-radius:16px;padding:19px;font:inherit;font-family:Archivo;font-weight:900;
  font-size:20px;letter-spacing:.04em;color:#0b0714;cursor:pointer;
  background:linear-gradient(135deg,#a3e635,var(--cyan));box-shadow:0 10px 40px rgba(34,211,238,.35);transition:.15s}
.playfab:hover{transform:translateY(-2px);box-shadow:0 16px 50px rgba(34,211,238,.5)}
.subrow{display:flex;gap:10px;margin-top:12px}
.subbtn{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--text);
  border-radius:12px;padding:12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.subbtn:hover{background:rgba(255,255,255,.11)}
.sheet-prog{height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:16px;overflow:hidden;display:none}
.sheet-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.hint{padding:8px 44px;font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.05)}
.hint b{color:var(--text)}
kbd{font-family:inherit;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:1px 6px;font-size:9.5px}
</style>
</head>
<body>

<nav class="tabs">
  <button class="tab on" data-v="home">Home</button>
  <button class="tab" data-v="games">Library</button>
  <button class="tab" data-v="consoles">Consoles</button>
  <button class="tab" data-v="crew">Crew</button>
  <div class="clock"><small>FRIDAY · CREW MODE</small><span id="clockT">7:42 PM</span></div>
</nav>

<div class="view" id="view"></div>

<div id="veil" onclick="closeSheet()"></div>
<section id="sheet"></section>
<footer class="hint"><b>←/→</b> browse &nbsp;·&nbsp; <b>ENTER</b> open &nbsp;·&nbsp; <b>ESC</b> back — controller and couch friendly</footer>

<script>
const VIEWS={
 home:()=>{
  return `<div class="greet">Late evening, <b>Sam</b> — swarm's healthy, 24 MB/s inbound, crew is online.</div>
   <h2 class="rowt">⚡ JUMP BACK <span>IN</span></h2>
   ${tiles([{n:"HADES II",m:"41% · save 10 min ago",g:"g2",rb:"RESUME",rc:"rb-play"},
     {n:"GTA VI",m:"grabs night 2 · 84%",g:"g4",rb:"DOWNLOADING",rc:"_rb"},
     {n:"PORTAL 2",m:"Maya is streaming to crew",g:"g8",rb:"MULTIPLAYER",rc:"rb-play"}],"wide")}
   <h2 class="rowt">🌊 READY TO <span>PLAY — ALREADY INSTALLED</span></h2>
   ${tiles([{n:"ELDEN RING",m:"Tarnished Edition",g:"g5"},{n:"CYBERPUNK 2077",m:"v2.3 · Phantom Liberty",g:"g6"},
     {n:"STARDEW VALLEY",m:"co-op farm saved",g:"g3"},{n:"HALO: MCC",m:"LAN night candidate",g:"g7"}],"big")}
   <h2 class="rowt">🧊 FRESH OFF THE <span>BOTTOM OF THE MAP</span></h2>
   ${tiles([{n:"DEEP ROCK GALACTIC",m:"3.2 GB · grab?",g:"g9",rb:"ONE CLICK AWAY",rc:"rb-free"},
     {n:"SEKIRO",m:"62 seeds hot",g:"g7"},{n:"DISCO ELYSIUM",m:"final cut",g:"g1"},
     {n:"PALWORLD",m:"servers yours",g:"g4"},{n:"SUBNAUTICA 2",m:"early drop",g:"g9"}],"wide")}`;
 },
 games:()=>{
  return `<h2 class="rowt">📚 FULL <span>LIBRARY</span> — 218 INSTALLED</h2>
   ${tiles([...Array(10)].map((_,i)=>({n:LIB[i%LIB.length],m:i%3==0?"installed":"ready to grab",g:"g"+((i%8)+1)})),"big")}
   <h2 class="rowt">🏛 CABINET <span>MODS</span> — arcade emulation presets</h2>
   ${tiles([{n:"VERTICAL SHMUPS",m:"MAME preset",g:"g6"},{n:"FIGHT NIGHT",m:"4-player sticks",g:"g2"},
     {n:"LIGHT GUNS",m:"photon sims",g:"g4"}],"wide")}`;
 },
 consoles:()=>{
  return `<h2 class="rowt">🕹 CONSOLE <span>DECKS</span></h2>
   <div class="console-grid">${[
    ["NINTENDO SWITCH","318 titles · Ryujinx HD pack","318","g3"],
    ["PLAYSTATION 5","streamed via Chiaki bridge","41","g1"],
    ["PS2 NIGHTS","1,843 titles · upscaled 4×","1843","g5"],
    ["GAMECUBE + WII","312 titles · Dolphin","312","g4"],
    ["GAME BOY ARCHIVE","2,914 carts · one library","2914","g7"],
    ["DREAMCAST ROOM","198 GD-ROM rips · Flycast","198","g2"]
   ].map(c=>`<div class="con ${c[3]}" tabindex="0" onclick="openSheet('${c[0]}','${c[1]}','c')" >
    <span class="n">${c[2]}</span><b>${c[0]}</b><small>${c[1]}</small></div>`).join("")}</div>`;
 },
 crew:()=>{
  return `<h2 class="rowt">👥 YOUR <span>CREW</span></h2>
   <div class="crew">${[
    ["M","Maya Chen","◉ playing Portal 2 — streamed from your rig","g1"],
    ["T","Tom Alvarez","copied 4 games today · 86 GB","g3"],
    ["P","Priya S.","request pending — Deep Rock Galactic","g6"],
    ["S","Sam O'Dell","idle · borrowed Blade Runner","g4"],
    ["E","Ellie Kim","hosting her own mirror",  "g9"]
   ].map(f=>`<div class="friend"><div class="fac ${f[3]}">${f[0]}</div>
    <div><b>${f[1]}</b><small>${f[2]}</small></div></div>`).join("")}</div>
   <h2 class="rowt" style="margin-top:30px">📻 HOUSE <span>ANNOUNCEMENTS</span></h2>
   <div class="friend" style="grid-column:1/-1"><div class="fac g5">⚓</div>
   <div><b>Crew chat is quiet</b><small>Private LAN mode — keep invites tight. Invite by secret passphrase only, never a public link.</small></div></div>`;
 }
};
const LIB=["HALO: MCC","FORZA HORIZON 5","IT TAKES TWO","OVERCOOKED! 2","BULLET HEAVEN","NIE:AUTOMATA","INSIDE","OUTER WILDS","GRIS","RUSTLUND"];

function tiles(list,size){
  return `<div class="tiles">${list.map(t=>{
    const rb=t.rb?`<span class="ribbon ${t.rc}">${t.rb}</span>`:'';
    return `<div class="tile ${size}" tabindex="0" onclick="openSheet('${t.n}','${t.m}',null,'${t.g}')">
     ${rb}<div class="t-fill ${size=='wide'?'small':''} ${t.g}" style="${(()=>{const w=(t.n.match(/[A-Za-z]{2,}/)||['GAME'])[0];const b=size=='mini'?30:size=='big'?24:40;return 'font-size:'+Math.round(w.length<=5?b:w.length<=8?b*0.8:b*0.62)+'px'})()}">${(t.n.match(/[A-Za-z]{2,}/)||['GAME'])[0]}</div>
     <div class="t-shade"></div><div class="t-label"><b>${t.n}</b><small>${t.m}</small></div></div>`;
  }).join('')}</div>`;
}
const COUNTERS={home:"home",games:"games"};
let cur="home";
function show(v){
  cur=v;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
  document.getElementById('view').innerHTML=VIEWS[v]();
  document.getElementById('view').scrollTop=0;
}
document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(b)show(b.dataset.v);
});

function openSheet(name,meta,g){
  const veil=document.getElementById('veil'),sheet=document.getElementById('sheet');
  const isCon=g=="c";
  sheet.innerHTML=isCon?`
    <div class="sh-head"><div class="sh-art" style="background:linear-gradient(135deg,#1e293b,#0f172a)">🕹</div>
     <div class="sh-info"><h3 class="disp">${name}</h3>
     <p>${meta}. Cores tuned per-title; the agent re-verifies bios and shader packs nightly.</p>
     <div class="chips"><span class="chip hot">AUTO-CORE</span><span class="chip">SAVES SYNCED</span><span class="chip">CRT BEZELS ON</span></div></div></div>
    <button class="playfab" onclick="launch(this,'${name}')">OPEN DECK ↵</button>
    <div class="sheet-prog" id="sprog"><i style="width:0"></i></div>`
  :`
    <div class="sh-head"><div class="sh-art" style="background:linear-gradient(135deg,#5b21b6,#0891b2)">${name.slice(0,3)}</div>
     <div class="sh-info"><h3 class="disp">${name}</h3>
     <p>${meta}. Community-verified release, virus scanned, recipe pre-loaded — hit PLAY and walk away.</p>
     <div class="chips"><span class="chip hot">$0.00</span><span class="chip">WAS $59.99</span><span class="chip">WIN 10/11</span><span class="chip">CONTROLLER ✓</span></div></div></div>
    <button class="playfab" onclick="launch(this,'${name}')">▶ PLAY</button>
    <div class="subrow"><button class="subbtn">🌏 Share to crew</button><button class="subbtn">💾 Grab full copy</button><button class="subbtn">⋯ Details</button></div>
    <div class="sheet-prog" id="sprog"><i style="width:0"></i></div>`;
  veil.classList.add('show'); sheet.classList.add('open');
}
function launch(btn,name){
  const bar=document.getElementById('sprog');
  btn.style.display='none'; bar.style.display='block';
  let p=0; const iv=setInterval(()=>{p+=Math.random()*11;if(p>=100){p=100;clearInterval(iv);
     bar.previousElementSibling&&!bar.parentElement.contains(btn);
     document.getElementById('sheet').querySelector('.playfab')?.insertAdjacentHTML('beforebegin','');
     document.getElementById('sprog').outerHTML=`<div style="text-align:center;padding:14px;font-family:Archivo;font-weight:900;font-size:17px;color:#a3e635">▸ LAUNCHING ${name.toUpperCase()}…</div>`;}
   document.querySelector('#sprog i')&&(document.querySelector('#sprog i').style.width=p+"%");
  },260);
}
function closeSheet(){document.getElementById('veil').classList.remove('show');document.getElementById('sheet').classList.remove('open')}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if(cur!=='home'||!e.key.startsWith('Arrow'))return;
  const els=[...document.querySelectorAll('.tiles .tile')];
  const i=els.indexOf(document.activeElement);
  if(i>=0&&e.key==='ArrowRight'&&els[i+1]){e.preventDefault();els[i+1].focus();els[i+1].scrollIntoView({block:'nearest',inline:'center'})}
  if(i>=0&&e.key==='ArrowLeft'&&els[i-1]){e.preventDefault();els[i-1].focus();els[i-1].scrollIntoView({block:'nearest',inline:'center'})}
  if(i===-1&&e.key==='ArrowRight'){els[0]?.focus()}
});
setInterval(()=>{const d=new Date();document.getElementById('clockT').textContent=
  d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},1000);
show('home');
</script>
</body>
</html>
